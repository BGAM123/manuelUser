framework:
    messenger:
        failure_transport: failed

        transports:
            # Transport asynchrone utilisant Doctrine
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            
            # Ajout du routing pour vos SMS personnalises
            App\Message\SmsMessage: async
            
            # Ajout du routing pour les logs asynchrones
            App\Message\UserActionLogMessage: async

# Commandes pour demarrer le worker:
# php bin/console messenger:consume async -vv
# nohup php bin/console messenger:consume async -vv > worker.log 2>&1 &
